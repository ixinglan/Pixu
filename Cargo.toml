[workspace]
resolver = "2"
members = [
    "app/src-tauri",
    "crates/pixu-app-service",
    "crates/pixu-domain-scan",
    "crates/pixu-domain-uninstall",
    "crates/pixu-safety-gate",
    "crates/pixu-safety-guard",
    "crates/pixu-fs-ops",
    "crates/pixu-platform-mac",
    "crates/pixu-infra",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
walkdir = "2"
sysinfo = "0.32"
plist = "1"
url = "2"
pixu-app-service = { path = "crates/pixu-app-service" }
pixu-domain-scan = { path = "crates/pixu-domain-scan" }
pixu-domain-uninstall = { path = "crates/pixu-domain-uninstall" }
pixu-safety-gate = { path = "crates/pixu-safety-gate" }
pixu-safety-guard = { path = "crates/pixu-safety-guard" }
pixu-fs-ops = { path = "crates/pixu-fs-ops" }
pixu-platform-mac = { path = "crates/pixu-platform-mac" }
pixu-infra = { path = "crates/pixu-infra" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
